<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wikiRAG</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#667085; --accent:#002f87; --border:#dde1e7; --err:#b42318; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#12151b; --card:#1b1f27; --text:#e6e8ec; --muted:#98a2b3; --accent:#7aa2ff; --border:#2c323d; --err:#f97066; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .sub { margin: 0; color: var(--muted); }
    .articles { margin: 6px 0 24px; padding-left: 22px; color: var(--muted); }
    a { color: inherit; text-decoration-color: var(--border); text-underline-offset: 3px; }
    a:hover { color: var(--text); text-decoration-color: currentColor; }
    form { display:flex; gap:8px; flex-wrap:wrap; }
    textarea { flex:1 1 400px; min-height:64px; padding:10px 12px; font:inherit; color:inherit; background:var(--card);
               border:1px solid var(--border); border-radius:8px; resize:vertical; }
    button { padding:10px 20px; font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
    @media (prefers-color-scheme: dark) { button { color:#12151b; } }
    button:disabled { opacity:.6; cursor:progress; }
    .card { margin-top:24px; padding:20px; background:var(--card); border:1px solid var(--border); border-radius:10px; }
    .label { font-size:.75rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
    .question { font-weight:600; margin-bottom:18px; }
    .answer { white-space: pre-wrap; }
    .answer a.marker { color:var(--accent); text-decoration:none; font-size:.8em; vertical-align:super; line-height:0; }
    .answer a.marker:hover { text-decoration:underline; }
    .citations { margin-top:18px; }
    .cite { padding:8px 0; border-top:1px solid var(--border); font-size:.9rem; }
    .cite .num { font-weight:700; margin-right:6px; }
    .cite-quote { margin:4px 0 0; color:var(--muted); font-style:italic; }
    .error { color: var(--err); }
    /* Corner menu, shared with metrics.html */
    .menu { position:fixed; top:16px; right:16px; z-index:10; }
    .menu summary { list-style:none; display:grid; place-items:center; width:40px; height:40px; color:var(--muted);
                    background:var(--card); border:1px solid var(--border); border-radius:8px; cursor:pointer; }
    .menu summary::-webkit-details-marker { display:none; }
    .menu summary:hover, .menu[open] summary { color:var(--text); }
    .menu nav { position:absolute; top:46px; right:0; min-width:160px; padding:6px; background:var(--card);
                border:1px solid var(--border); border-radius:10px; box-shadow:0 8px 24px rgb(0 0 0 / .12); }
    .menu nav a, .menu nav button { display:block; width:100%; padding:8px 10px; font:inherit; font-size:.95rem; font-weight:400;
                                    text-align:left; color:var(--text); background:none; border:0; border-radius:6px; text-decoration:none; cursor:pointer; }
    .menu nav a:hover, .menu nav button:hover { background:var(--bg); }
    .menu nav a[aria-current="page"] { font-weight:600; }
    .menu nav form { display:block; margin-top:4px; padding-top:4px; border-top:1px solid var(--border); }
  </style>
</head>
<body>
<details class="menu">
  <summary aria-label="Menu">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4.5h14M2 9h14M2 13.5h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </summary>
  <nav>
    <a href="/" aria-current="page">Ask</a>
    <a href="/metrics">Metrics</a>
    <form method="post" action="/logout"><button type="submit">Log out</button></form>
  </nav>
</details>
<main>
  <h1>wikiRAG</h1>
  <p class="sub">This is a toy RAG system designed to answer simple questions based on these select Wikipedia articles:</p>
  <ul id="articles" class="articles"></ul>

  <form id="ask-form">
    <textarea id="question" maxlength="1000" placeholder="How many championships have the Blues won?" required></textarea>
    <button id="submit" type="submit">Ask</button>
  </form>

  <section id="result" class="card" hidden>
    <div class="label">Question</div>
    <div id="q-out" class="question"></div>
    <div class="label">Answer</div>
    <div id="a-out" class="answer"></div>
    <div id="citations" class="citations" hidden>
      <div class="label">Sources</div>
    </div>
  </section>
</main>

<script>
  // Close the corner menu on an outside click or Escape.
  const menu = document.querySelector(".menu");
  document.addEventListener("click", (e) => { if (!menu.contains(e.target)) menu.open = false; });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") menu.open = false; });

  // The indexed article list lives in app.py (indexed_articles).
  fetch("/api/articles")
    .then((res) => (res.ok ? res.json() : []))
    .then((list) => {
      const ul = document.getElementById("articles");
      for (const { title, url } of list) {
        const a = document.createElement("a");
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = title;
        const li = document.createElement("li");
        li.appendChild(a);
        ul.appendChild(li);
      }
    });

  const form = document.getElementById("ask-form");
  const input = document.getElementById("question");
  const button = document.getElementById("submit");
  const result = document.getElementById("result");
  const qOut = document.getElementById("q-out");
  const aOut = document.getElementById("a-out");
  const citations = document.getElementById("citations");
  const citationsLabel = citations.firstElementChild;

  // Ctrl/Cmd+Enter submits.
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) form.requestSubmit();
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    button.disabled = true;
    button.textContent = "Thinking…";
    result.hidden = false;
    qOut.textContent = question;
    aOut.textContent = "…";
    aOut.classList.remove("error");
    citations.hidden = true;
    citations.replaceChildren(citationsLabel);

    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      if (res.status === 401) {
        location.replace("/login");
        return;
      }
      // Error pages from a proxy (e.g. Cloudflare) can be HTML rather than JSON.
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : `Request failed (${res.status})`);
      if (!data.answer) throw new Error("The server returned an unexpected response.");

      renderAnswer(data.answer, data.citations);
      // One row per citation: the section link, plus the quoted span it highlights.
      for (const c of data.citations) {
        const item = document.createElement("div");
        item.className = "cite";
        const num = document.createElement("span");
        num.className = "num";
        num.textContent = `[${c.number}]`;
        item.append(num, citationLink(c, c.label || c.source));
        if (c.quote) {
          const quote = document.createElement("p");
          quote.className = "cite-quote";
          quote.textContent = `“${c.quote}”`;
          item.append(quote);
        }
        citations.appendChild(item);
      }
      citations.hidden = data.citations.length === 0;
    } catch (err) {
      aOut.textContent = err.message;
      aOut.classList.add("error");
    } finally {
      button.disabled = false;
      button.textContent = "Ask";
    }
  });

  // A link to the cited span of the Wikipedia article (plain text if there is no url).
  function citationLink(c, text) {
    if (!c.url) {
      const span = document.createElement("span");
      span.textContent = text;
      return span;
    }
    const a = document.createElement("a");
    a.href = c.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = text;
    if (c.quote) a.title = c.quote;
    return a;
  }

  // Turn each [n] marker in the answer into a link to citation n; everything else stays plain text.
  function renderAnswer(answer, cites) {
    const byNumber = new Map(cites.map((c) => [c.number, c]));
    aOut.replaceChildren();
    let last = 0;
    for (const m of answer.matchAll(/\[(\d+)\]/g)) {
      const c = byNumber.get(Number(m[1]));
      if (!c) continue;
      const link = citationLink(c, m[0]);
      link.classList.add("marker");
      aOut.append(answer.slice(last, m.index), link);
      last = m.index + m[0].length;
    }
    aOut.append(answer.slice(last));
  }
</script>
</body>
</html>
