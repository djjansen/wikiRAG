<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wikiRAG</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#667085; --accent:#002f87; --border:#dde1e7; --err:#b42318; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#12151b; --card:#1b1f27; --text:#e6e8ec; --muted:#98a2b3; --accent:#7aa2ff; --border:#2c323d; --err:#f97066; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
    header { display:flex; justify-content:space-between; align-items:baseline; gap:16px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .logout { padding:0; font-size:.9rem; font-weight:400; color:var(--muted); background:none; text-decoration:underline; }
    .sub { margin: 0; color: var(--muted); }
    .articles { margin: 6px 0 24px; padding-left: 22px; color: var(--muted); }
    a { color: inherit; text-decoration-color: var(--border); text-underline-offset: 3px; }
    a:hover { color: var(--text); text-decoration-color: currentColor; }
    form { display:flex; gap:8px; flex-wrap:wrap; }
    textarea { flex:1 1 400px; min-height:64px; padding:10px 12px; font:inherit; color:inherit; background:var(--card);
               border:1px solid var(--border); border-radius:8px; resize:vertical; }
    button { padding:10px 20px; font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
    @media (prefers-color-scheme: dark) { button { color:#12151b; } }
    button:disabled { opacity:.6; cursor:progress; }
    .card { margin-top:24px; padding:20px; background:var(--card); border:1px solid var(--border); border-radius:10px; }
    .label { font-size:.75rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
    .question { font-weight:600; margin-bottom:18px; }
    .answer { white-space: pre-wrap; }
    .citations { margin-top:18px; }
    details { border-top:1px solid var(--border); }
    summary { padding:8px 0; cursor:pointer; color:var(--muted); font-size:.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    summary .num { font-weight:700; color:var(--text); margin-right:6px; }
    .cite-text { margin:0 0 12px; padding:10px 12px; max-height:320px; overflow:auto; white-space:pre-wrap; font-size:.85rem;
                 background:var(--bg); border-radius:8px; }
    .error { color: var(--err); }
  </style>
</head>
<body>
<main>
  <header>
    <h1>wikiRAG</h1>
    <form method="post" action="/logout"><button class="logout" type="submit">Log out</button></form>
  </header>
  <p class="sub">This is a toy RAG system designed to answer simple questions based on these select Wikipedia articles:</p>
  <ul id="articles" class="articles"></ul>

  <form id="ask-form">
    <textarea id="question" maxlength="1000" placeholder="How many championships have the Blues won?" required></textarea>
    <button id="submit" type="submit">Ask</button>
  </form>

  <section id="result" class="card" hidden>
    <div class="label">Question</div>
    <div id="q-out" class="question"></div>
    <div class="label">Answer</div>
    <div id="a-out" class="answer"></div>
    <div id="citations" class="citations" hidden>
      <div class="label">Sources</div>
    </div>
  </section>
</main>

<script>
  // The indexed article list lives in app.py (indexed_articles).
  fetch("/api/articles")
    .then((res) => (res.ok ? res.json() : []))
    .then((list) => {
      const ul = document.getElementById("articles");
      for (const { title, url } of list) {
        const a = document.createElement("a");
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = title;
        const li = document.createElement("li");
        li.appendChild(a);
        ul.appendChild(li);
      }
    });

  const form = document.getElementById("ask-form");
  const input = document.getElementById("question");
  const button = document.getElementById("submit");
  const result = document.getElementById("result");
  const qOut = document.getElementById("q-out");
  const aOut = document.getElementById("a-out");
  const citations = document.getElementById("citations");
  const citationsLabel = citations.firstElementChild;

  // Ctrl/Cmd+Enter submits.
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) form.requestSubmit();
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    button.disabled = true;
    button.textContent = "Thinking…";
    result.hidden = false;
    qOut.textContent = question;
    aOut.textContent = "…";
    aOut.classList.remove("error");
    citations.hidden = true;
    citations.replaceChildren(citationsLabel);

    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      if (res.status === 401) {
        location.replace("/login");
        return;
      }
      const data = await res.json();
      if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : `Request failed (${res.status})`);

      aOut.textContent = data.answer;
      // One collapsed <details> per citation; the number matches the [n] markers in the answer.
      for (const c of data.citations) {
        const item = document.createElement("details");
        const summary = document.createElement("summary");
        const num = document.createElement("span");
        num.className = "num";
        num.textContent = `[${c.number}]`;
        // Preview the start of the cited text; CSS truncates it to one line.
        summary.append(num, c.text.replace(/\s+/g, " ").trim().slice(0, 200));
        const text = document.createElement("p");
        text.className = "cite-text";
        text.textContent = c.text;
        item.append(summary, text);
        citations.appendChild(item);
      }
      citations.hidden = data.citations.length === 0;
    } catch (err) {
      aOut.textContent = err.message;
      aOut.classList.add("error");
    } finally {
      button.disabled = false;
      button.textContent = "Ask";
    }
  });
</script>
</body>
</html>
